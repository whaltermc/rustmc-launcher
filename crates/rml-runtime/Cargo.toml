[package]
name = "rml-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
rml-core = { path = "../rml-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
xz2 = "0.1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
