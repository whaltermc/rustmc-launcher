[package]
name = "rml-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
rml-core = { path = "../rml-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
thiserror = "1.0"
md-5 = "0.10"
