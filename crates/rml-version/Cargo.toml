[package]
name = "rml-version"
version = "0.1.0"
edition = "2021"

[dependencies]
rml-core = { path = "../rml-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
sha1 = "0.10"
futures-util = "0.3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "fs"] }
