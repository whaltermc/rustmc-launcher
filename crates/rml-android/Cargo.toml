[package]
name = "rml-android"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "rml_ui"

[dependencies]
rml-core = { path = "../rml-core" }
rml-auth = { path = "../rml-auth" }
rml-version = { path = "../rml-version" }
rml-runtime = { path = "../rml-runtime" }
rml-jvm = { path = "../rml-jvm" }
jni = "0.21"
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
